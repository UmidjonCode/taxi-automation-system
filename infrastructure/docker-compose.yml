# Starts the message broker that all four microservices + the dashboard share.
# The services themselves run via `dotnet run` (see ../run-local.sh) or can be
# containerised later. RabbitMQ management UI: http://localhost:15672 (guest/guest).
services:
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: hotelos-rabbitmq
    hostname: hotelos-rabbitmq
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # management UI
    volumes:
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
